[project]
name = "context-engineering-multi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.6"
dependencies = [
    "a2a-sdk>=0.3.16",
    "crewai[a2a]>=1.6.1",
    "cvss>=2.7.0",
    "fastapi>=0.124.0",
    "httpx>=0.27.2",
    "mcp[cli]>=1.22.0",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.8",
    "pydantic-ai[mcp,openai]>=1.29.0",
    "qdrant-client>=1.16.2",
    "uvicorn>=0.38.0",
    "tqdm>=4.66.1",
    "langchain-openai>=1.1.7",
    "langchain>=0.2.0",
    "langfuse>=3.11.2",
    "openinference-instrumentation-crewai>=0.1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
test = "scripts.test_endpoint:main"
pipeline = "scripts.pipeline:main"
bloat-sweep = "scripts.bloat_sweep:main"

[tool.setuptools]
package-dir = { "gateway" = "pipelines/gateway", "evaluation" = "evaluation/src", "simple" = "pipelines/simple-crew", "shared" = "shared", "mcp-server" = "mcp-server", "scripts" = "scripts" }
